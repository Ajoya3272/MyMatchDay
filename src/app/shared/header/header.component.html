<header class="app-header">
  <button
    class="app-header__icon-btn"
    type="button"
    aria-label="Abrir menú"
    (click)="openMainMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <button
    class="app-header__brand"
    type="button"
    aria-label="Volver al inicio"
    (click)="goHome()"
  >
    <strong class="app-header__title">MYMATCHDAY</strong>
  </button>

  <div class="app-header__profile" (click)="onProfileAreaClick($event)">
    <button
      class="app-header__avatar-btn"
      type="button"
      aria-label="Abrir menú de perfil"
      (click)="toggleProfileMenu()"
    >
      <span class="app-header__avatar">
        {{ (inicialUsuario$ | async) ?? "U" }}
      </span>
    </button>

    <div class="app-header__profile-menu" *ngIf="isProfileOpen">
      <button
        type="button"
        class="app-header__profile-item"
        (click)="goPerfil()"
      >
        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
        <span>Mi perfil</span>
      </button>

      <button
        type="button"
        class="app-header__profile-item"
        (click)="goAjustes()"
      >
        <ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
        <span>Ajustes</span>
      </button>

      <button
        type="button"
        class="app-header__profile-item app-header__profile-item--danger"
        (click)="cerrarSesion()"
      >
        <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
