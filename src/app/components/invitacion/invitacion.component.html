<ion-content class="invitacion-page">
  <div class="invitacion-page__wrapper">
    <div class="invitacion-card">
      <p class="invitacion-card__eyebrow">Invitación</p>

      <h1 class="invitacion-card__title">¿Quieres unirte al partido?</h1>

      <p class="invitacion-card__text invitacion-card__text--highlight">
        <strong>{{ matchName }}</strong>
      </p>

      <p class="invitacion-card__text">
        Organizado por <strong>{{ organizerName }}</strong>
      </p>

      <div class="invitacion-card__slug">
        {{ slug }}
      </div>

      <div class="invitacion-card__actions">
        <button
          class="invitacion-card__button invitacion-card__button--secondary"
          type="button"
          (click)="goHome()"
        >
          Cancelar
        </button>

        <button
          class="invitacion-card__button invitacion-card__button--primary"
          type="button"
          (click)="goToMatchDetails()"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
</ion-content>
