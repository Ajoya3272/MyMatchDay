<header class="app-header">
  <button
    class="app-header__icon-btn"
    type="button"
    aria-label="Open menu"
    (click)="openMainMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <button
    class="app-header__brand"
    type="button"
    aria-label="Volver al inicio"
    (click)="goHome()"
  >
    <strong class="app-header__title">MYMATCHDAY</strong>
  </button>

  <div class="app-header__profile">
    <button
      class="app-header__avatar-btn"
      type="button"
      aria-label="Open profile menu"
      (click)="toggleProfileMenu()"
    >
      <span class="app-header__avatar">S</span>
    </button>

    <div class="app-header__profile-menu" *ngIf="isProfileOpen">
      <button type="button" class="app-header__profile-item">My profile</button>
      <button type="button" class="app-header__profile-item">Settings</button>
      <button type="button" class="app-header__profile-item">Log out</button>
    </div>
  </div>
</header>
