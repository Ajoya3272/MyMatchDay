<ion-content class="create-match-page">
  <app-spinner *ngIf="creatingMatch" texto="Creando partido..."></app-spinner>

  <section class="create-match-page__wrapper">
    <header class="create-match-page__header">
      <p class="create-match-page__eyebrow">Nuevo partido</p>

      <h1 class="create-match-page__title">Crea tu partido paso a paso</h1>

      <p class="create-match-page__subtitle">
        Elige la pista, la fecha y la hora, y genera un enlace para invitar a
        tus colegas.
      </p>
    </header>

    <div class="create-match-page__progress">
      <div class="create-match-page__steps">
        <span
          [class.completed]="currentStep > 1"
          [class.active]="currentStep === 1"
        >
          1. Pista
        </span>

        <span
          [class.completed]="currentStep > 2"
          [class.active]="currentStep === 2"
        >
          2. Horario
        </span>

        <span
          [class.completed]="currentStep > 3"
          [class.active]="currentStep === 3"
        >
          3. Datos
        </span>

        <span [class.completed]="created" [class.active]="currentStep === 4">
          4. Invitación
        </span>
      </div>

      <ion-progress-bar
        class="create-match-page__progress-bar"
        [class.step-2]="currentStep >= 2"
        [class.step-3]="currentStep >= 3"
        [class.step-4]="currentStep >= 4"
        [value]="progressValue"
      ></ion-progress-bar>
    </div>

    <div class="create-match-card">
      <div class="step-shell">
        <div class="step-panel" [class]="stepAnimationClass">
          <div class="create-match-card__section" [hidden]="currentStep !== 1">
            <app-step-one
              (pistaSeleccionadaChange)="onPistaSeleccionada($event)"
            ></app-step-one>
          </div>

          <div class="create-match-card__section" [hidden]="currentStep !== 2">
            <app-step-two
              [pista]="pistaSeleccionada"
              (horarioSeleccionado)="onHorarioSeleccionado($event)"
              (volver)="volverAPistas()"
            ></app-step-two>
          </div>

          <ng-container *ngIf="currentStep === 3">
            <div class="create-match-card__section">
              <div [hidden]="!!datosPartidoPendientes">
                <app-step-three
                  [pista]="pistaSeleccionada"
                  [fecha]="fechaSeleccionada"
                  [hora]="horaSeleccionada"
                  [creatingMatch]="creatingMatch"
                  (datosConfirmados)="onDatosPartidoConfirmados($event)"
                  (volver)="volverACalendario()"
                ></app-step-three>
              </div>

              <ng-container *ngIf="datosPartidoPendientes">
                <app-paypal-payment
                  [amount]="precioPista!"
                  [payeeEmail]="paypalEmailPista"
                  (pagoCompletado)="onPagoCompletado($event)"
                  (pagoError)="onPagoError()"
                ></app-paypal-payment>

                <button
                  type="button"
                  class="secondary-action"
                  [disabled]="creatingMatch"
                  (click)="cancelarPago()"
                >
                  Atrás
                </button>
              </ng-container>
            </div>
          </ng-container>

          <ng-container *ngIf="currentStep === 4">
            <div class="create-match-card__section">
              <app-step-four
                [inviteLink]="inviteLink"
                (volverAlInicio)="goHome()"
              ></app-step-four>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </section>
</ion-content>
