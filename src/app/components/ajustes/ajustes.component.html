<ion-content class="ajustes-page" [fullscreen]="true">
  <section class="ajustes">
    <header class="ajustes__header">
      <p class="ajustes__eyebrow">Ajustes</p>
      <h1 class="ajustes__title">Tema de la aplicación</h1>
    </header>

    <div class="theme-card">
      <div class="theme-card__info">
        <h2 class="theme-card__title">Apariencia</h2>
        <p class="theme-card__text">
          Cambia el aspecto visual de la interfaz en todo momento.
        </p>
      </div>

      <div class="theme-toggle">
        <button
          type="button"
          class="theme-toggle__option theme-toggle__option--dark"
          [class.theme-toggle__option--active]="isActive('dark')"
          (click)="setTheme('dark')"
        >
          <span class="theme-toggle__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
                fill="currentColor"
              />
            </svg>
          </span>
          <span class="theme-toggle__text">
            <span class="theme-toggle__label">Modo oscuro</span>
          </span>
        </button>

        <button
          type="button"
          class="theme-toggle__option theme-toggle__option--light"
          [class.theme-toggle__option--active]="isActive('light')"
          (click)="setTheme('light')"
        >
          <span class="theme-toggle__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="theme-toggle__text">
            <span class="theme-toggle__label">Modo claro</span>
          </span>
        </button>
      </div>
    </div>
  </section>
</ion-content>
